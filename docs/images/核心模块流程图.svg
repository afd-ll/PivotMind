  <text x="405" y="90" fill="#64748b" font-size="9">cognitive_controller.c</text>

  <rect x="405" y="105" width="300" height="55" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="0.8"/>
  <text x="420" y="125" fill="#e2e8f0" font-size="10" font-weight="600">compute_intent</text>
  <text x="420" y="142" fill="#94a3b8" font-size="8">意图向量计算 · NN 置信度因子</text>

  <line x1="555" y1="160" x2="555" y2="175" stroke="#fb923c" stroke-width="0.8" marker-end="url(#arr)"/>

  <rect x="405" y="175" width="300" height="55" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="0.8"/>
  <text x="420" y="195" fill="#e2e8f0" font-size="10" font-weight="600">evaluate_draft</text>
