<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0c1220"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="20" y="28" fill="#48dbfb" font-size="16" font-weight="700">训练工作流 — batch_learn</text>

  <!-- Step 1 -->
  <rect x="40" y="55" width="200" height="70" rx="8" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="82" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">[1/4] 加载拓扑</text>
  <text x="140" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">master_load_state()</text>
  <text x="140" y="114" fill="#94a3b8" font-size="9" text-anchor="middle">或 master_topology_create()</text>

  <line x1="240" y1="90" x2="285" y2="90" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="290" y="55" width="200" height="70" rx="8" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.5"/>
  <text x="390" y="82" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">[2/4] 解析QA数据</text>
  <text x="390" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">JSON格式 25MB</text>
  <text x="390" y="114" fill="#94a3b8" font-size="9" text-anchor="middle">→ questions[] / answers[]</text>

  <line x1="490" y1="90" x2="535" y2="90" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="540" y="55" width="200" height="70" rx="8" fill="rgba(251,146,60,0.25)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="640" y="82" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">[3/4] 喂入学习器</text>
  <text x="640" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">OpenMP 并行 for</text>
  <text x="640" y="114" fill="#94a3b8" font-size="9" text-anchor="middle">autonomic_learn</text>

  <line x1="740" y1="90" x2="785" y2="90" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="790" y="55" width="180" height="70" rx="8" fill="rgba(76,29,149,0.25)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="880" y="82" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">[4/4] 保存状态</text>
  <text x="880" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">master_save_state()</text>
  <text x="880" y="114" fill="#94a3b8" font-size="9" text-anchor="middle">pivotmind_state.dat</text>

  <!-- Detail section -->
  <rect x="40" y="155" width="930" height="320" rx="8" fill="rgba(15,23,42,0.3)" stroke="#1e293b" stroke-width="1"/>

  <!-- Autonomic Learner detail -->
  <text x="60" y="182" fill="#fb923c" font-size="12" font-weight="700">第3步详解: 学习器内部循环</text>

  <rect x="60" y="198" width="180" height="60" rx="6" fill="rgba(251,146,60,0.12)" stroke="#fb923c" stroke-width="0.8"/>
  <text x="150" y="222" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">For each QA pair</text>
  <text x="150" y="240" fill="#94a3b8" font-size="8" text-anchor="middle">question + answer</text>

  <line x1="240" y1="228" x2="275" y2="228" stroke="#fb923c" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="280" y="198" width="200" height="60" rx="6" fill="rgba(6,78,59,0.12)" stroke="#34d399" stroke-width="0.8"/>
  <text x="380" y="218" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">词汇拓扑分词</text>
  <text x="380" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">逐字/逐词注册节点</text>
  <text x="380" y="250" fill="#94a3b8" font-size="8" text-anchor="middle">涌现式词类 POS 标注</text>

  <line x1="480" y1="228" x2="515" y2="228" stroke="#34d399" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="520" y="198" width="200" height="60" rx="6" fill="rgba(76,29,149,0.12)" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="620" y="218" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">赫布在线学习</text>
  <text x="620" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">同时激活→加强连接</text>
  <text x="620" y="250" fill="#94a3b8" font-size="8" text-anchor="middle">跨拓扑边建立</text>

  <line x1="720" y1="228" x2="755" y2="228" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="760" y="198" width="190" height="60" rx="6" fill="rgba(136,19,55,0.12)" stroke="#fb7185" stroke-width="0.8"/>
  <text x="855" y="218" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">激活衰减</text>
  <text x="855" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">低活跃边降权</text>
  <text x="855" y="250" fill="#94a3b8" font-size="8" text-anchor="middle">灾难性遗忘防护</text>

  <!-- Learning modes -->
  <text x="60" y="300" fill="#48dbfb" font-size="11" font-weight="700">训练模式</text>
  
  <rect x="60" y="315" width="270" height="55" rx="6" fill="rgba(8,51,68,0.15)" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="195" y="338" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">train_mode (批量语料)</text>
  <text x="195" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">GET /train/start → 多轮喂入 → 暂停/恢复</text>

  <rect x="350" y="315" width="270" height="55" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="485" y="338" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">self_learner (自主修正)</text>
  <text x="485" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">脑干调度 · 周期性修正 · 传递/降权</text>

  <rect x="640" y="315" width="310" height="55" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="795" y="338" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">perception_feed_learn_text (PMI)</text>
  <text x="795" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">/learn端点 → article_reader → 词共现频率表</text>

  <!-- Stats -->
  <rect x="60" y="390" width="890" height="55" rx="6" fill="rgba(6,78,59,0.08)" stroke="#34d399" stroke-width="0.5"/>
  <text x="80" y="415" fill="#64748b" font-size="9" font-weight="600">训练统计</text>
  <text x="80" y="432" fill="#94a3b8" font-size="8">新增节点 · 新增边 · 修正次数 · 冷冻/解冻 · EMA更新 · 脑区索引迁移</text>
</svg>