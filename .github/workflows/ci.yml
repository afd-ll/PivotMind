name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev libssl-dev libcurl4-openssl-dev zlib1g-dev
      - name: Build (x86_64, OpenMP)
        run: make linux
      - name: Run tests (skip test-chinese — needs windows.h)
        run: make test-tensor test-model test-metrics test-trainer test-io test-cc test-web-fetch
      - name: Show binaries
        run: file build/bin/*

  build-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross

      - name: Build OpenSSL for ARM
        run: |
          curl -sL https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz -o /tmp/openssl.tar.gz
          tar xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.0.15
          # OpenSSL 3.0 交叉编译标准流程
          CROSS=arm-linux-gnueabihf
          ./Configure linux-armv4 \
            --prefix=/tmp/openssl-arm \
            --cross-compile-prefix=${CROSS}- \
            no-asm no-shared no-dso no-engine no-ui-console no-tests
          make -j$(nproc)
          make install_sw

      - name: Build libcurl for ARM
        run: |
          curl -sL https://curl.se/download/curl-8.12.1.tar.gz -o /tmp/curl.tar.gz
          tar xzf /tmp/curl.tar.gz -C /tmp
          cd /tmp/curl-8.12.1
          # 禁用 pkg-config（主机 pkg-config 无法识别 ARM 交叉编译链）
          export PKG_CONFIG_LIBDIR=/tmp/curl-arm/lib/pkgconfig
          mkdir -p $PKG_CONFIG_LIBDIR
          CC=arm-linux-gnueabihf-gcc \
          CPPFLAGS="-I/tmp/openssl-arm/include" \
          LDFLAGS="-L/tmp/openssl-arm/lib" \
          ./configure \
            --build=x86_64-linux-gnu \
            --host=arm-linux-gnueabihf \
            --prefix=/tmp/curl-arm \
            --with-openssl=/tmp/openssl-arm \
            --without-nghttp2 \
            --without-zstd \
            --without-brotli \
            --disable-shared \
            --disable-ldap \
            --without-libpsl \
            --disable-libcurl-option
          make -j$(nproc)
          make install

      - name: Build ARM (no OpenMP — no libgomp for ARM target)
        run: |
          make linux \
            CC=arm-linux-gnueabihf-gcc \
            CFLAGS="-Wall -Wextra -O2 -Iinclude -I. -Ilibs -I/tmp/openssl-arm/include -I/tmp/curl-arm/include -std=gnu99 -MD -MP -DHAS_OPENSSL" \
            LDFLAGS="-L/tmp/openssl-arm/lib -L/tmp/curl-arm/lib -lm -lssl -lcrypto -lcurl -lz -pthread -static-libstdc++"

      - name: Verify ARM ELF
        run: |
          file build/bin/*
          readelf -h build/bin/pivotmind_gateway | grep 'Machine:'
          # 验证链接的库
          arm-linux-gnueabihf-readelf -d build/bin/pivotmind_gateway | grep NEEDED
