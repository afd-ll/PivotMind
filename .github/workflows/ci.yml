name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev libssl-dev libcurl4-openssl-dev zlib1g-dev
      - name: Build (x86_64, OpenMP)
        run: make linux
      - name: Run tests (skip test-chinese — needs windows.h)
        run: make test-tensor test-model test-metrics test-trainer test-io test-cc test-web-fetch test-dialog-unit test-diffusion-unit test-topology-unit test-memory-unit test-learner-unit test-causal-unit test-forgetting-unit test-integration
      - name: Show binaries
        run: file build/bin/*

  build-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build zlib for ARM64
        run: |
          curl -sL https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz -o /tmp/zlib.tar.gz
          tar xzf /tmp/zlib.tar.gz -C /tmp
          cd /tmp/zlib-1.3.1
          CC=aarch64-linux-gnu-gcc \
          ./configure --prefix=/tmp/zlib-arm
          make -j$(nproc)
          make install

      - name: Build OpenSSL for ARM64
        run: |
          curl -sL https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz -o /tmp/openssl.tar.gz
          tar xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.0.15
          CROSS=aarch64-linux-gnu
          ./Configure linux-aarch64 \
            --prefix=/tmp/openssl-arm \
            --cross-compile-prefix=${CROSS}- \
            no-asm no-shared no-dso no-engine no-ui-console no-tests
          make -j$(nproc)
          make install_sw

      - name: Build libcurl for ARM64
        run: |
          curl -sL https://curl.se/download/curl-8.12.1.tar.gz -o /tmp/curl.tar.gz
          tar xzf /tmp/curl.tar.gz -C /tmp
          cd /tmp/curl-8.12.1
          export PKG_CONFIG_LIBDIR=/tmp/curl-arm/lib/pkgconfig
          mkdir -p $PKG_CONFIG_LIBDIR
          CC=aarch64-linux-gnu-gcc \
          CPPFLAGS="-I/tmp/openssl-arm/include -I/tmp/zlib-arm/include" \
          LDFLAGS="-L/tmp/openssl-arm/lib -L/tmp/zlib-arm/lib" \
          ./configure \
            --build=x86_64-linux-gnu \
            --host=aarch64-linux-gnu \
            --prefix=/tmp/curl-arm \
            --with-openssl=/tmp/openssl-arm \
            --with-zlib=/tmp/zlib-arm \
            --without-nghttp2 \
            --without-zstd \
            --without-brotli \
            --disable-shared \
            --disable-ldap \
            --without-libpsl \
            --disable-libcurl-option
          make -j$(nproc)
          make install

      - name: Build ARM64
        run: |
          make linux \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-Wall -Wextra -O2 -Iinclude -Iinclude/nn -Isrc/nn -I. -Ilibs -I/tmp/openssl-arm/include -I/tmp/curl-arm/include -I/tmp/zlib-arm/include -std=gnu99 -fopenmp -pthread -MD -MP -DHAS_OPENSSL" \
            LDFLAGS="-L/tmp/openssl-arm/lib -L/tmp/curl-arm/lib -L/tmp/zlib-arm/lib -lm -lcurl -lssl -lcrypto -lz -pthread -static-libstdc++"

      - name: Verify ARM64 ELF
        run: |
          file build/bin/*
          aarch64-linux-gnu-readelf -h build/bin/pivotmind_gateway | grep 'Machine:'
          aarch64-linux-gnu-readelf -d build/bin/pivotmind_gateway | grep NEEDED
